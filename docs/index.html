\r\n            let csv = '时间(s),位移(mm)\\n';\r\n            for (let i = 0; i \u003c timeHistory.length; i++) {\r\n                csv += `${timeHistory[i].toFixed(4)},${(displacementHistory[i] * 1000).toFixed(6)}\\n`;\r\n            }\r\n\r\n            const blob = new Blob([csv], { type: 'text/csv' });\r\n            const url = window.URL.createObjectURL(blob);\r\n            const a = document.createElement('a');\r\n            a.href = url;\r\n            a.download = `beam_vibration_${new Date().getTime()}.csv`;\r\n            a.click();\r\n            window.URL.revokeObjectURL(url);\r\n        }\r\n\r\n        // Event listeners\r\n        document.getElementById('amplitude').addEventListener('input', (e) => {\r\n            amplitude = parseFloat(e.target.value);\r\n            document.getElementById('ampValue').textContent = amplitude.toFixed(1);\r\n        });\r\n\r\n        document.getElementById('speed').addEventListener('input', (e) => {\r\n            animationSpeed = parseFloat(e.target.value);\r\n            document.getElementById('speedValue').textContent = animationSpeed.toFixed(1) + 'x';\r\n        });\r\n\r\n        document.getElementById('damping').addEventListener('input', (e) => {\r\n            dampingRatio = parseFloat(e.target.value);\r\n            document.getElementById('dampValue').textContent = dampingRatio.toFixed(2);\r\n        });\r\n\r\n        document.getElementById('randomIntensity').addEventListener('input', (e) => {\r\n            randomIntensity = parseFloat(e.target.value);\r\n            document.getElementById('randomValue').textContent = randomIntensity.toFixed(1);\r\n        });\r\n\r\n        for (let i = 1; i \u003c= 4; i++) {\r\n            document.getElementById(`mode${i}`).addEventListener('change', updateFrequencyDisplay);\r\n        }\r\n\r\n        // Start animation\r\n        updateFrequencyDisplay();\r\n        animate();\r\n    \u003c/script>\r\n\u003c/body>\r\n\u003c/html>","bridge_vibration.html":"\u003c!DOCTYPE html>\r\n\u003chtml lang=\"zh-CN\">\r\n\u003chead>\r\n    \u003cmeta charset=\"UTF-8\">\r\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n    \u003ctitle>大跨度桥梁振动分析系统\u003c/title>\r\n    \u003cstyle>\r\n        * {\r\n            margin: 0;\r\n            padding: 0;\r\n            box-sizing: border-box;\r\n        }\r\n\r\n        body {\r\n            font-family: 'Microsoft YaHei', 'Arial', sans-serif;\r\n            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);\r\n            padding: 20px;\r\n            min-height: 100vh;\r\n        }\r\n\r\n        .container {\r\n            max-width: 1800px;\r\n            margin: 0 auto;\r\n            background: white;\r\n            border-radius: 20px;\r\n            padding: 30px;\r\n            box-shadow: 0 20px 60px rgba(0,0,0,0.3);\r\n        }\r\n\r\n        h1 {\r\n            text-align: center;\r\n            color: #1e3c72;\r\n            margin-bottom: 10px;\r\n            font-size: 32px;\r\n        }\r\n\r\n        .subtitle {\r\n            text-align: center;\r\n            color: #666;\r\n            margin-bottom: 30px;\r\n            font-size: 16px;\r\n        }\r\n\r\n        .main-content {\r\n            display: grid;\r\n            grid-template-columns: 1fr 350px;\r\n            gap: 30px;\r\n            margin-bottom: 30px;\r\n        }\r\n\r\n        .canvas-container {\r\n            background: #f8f9fa;\r\n            border-radius: 15px;\r\n            padding: 20px;\r\n            box-shadow: 0 4px 15px rgba(0,0,0,0.1);\r\n        }\r\n\r\n        canvas {\r\n            display: block;\r\n            width: 100%;\r\n            background: white;\r\n            border-radius: 10px;\r\n        }\r\n\r\n        #bridgeCanvas {\r\n            height: 500px;\r\n        }\r\n\r\n        .charts-section {\r\n            display: grid;\r\n            grid-template-columns: 1fr 1fr;\r\n            gap: 20px;\r\n            margin-top: 20px;\r\n        }\r\n\r\n        .chart-container {\r\n            background: #f8f9fa;\r\n            border-radius: 15px;\r\n            padding: 20px;\r\n            box-shadow: 0 4px 15px rgba(0,0,0,0.1);\r\n        }\r\n\r\n        .chart-container h3 {\r\n            color: #1e3c72;\r\n            margin-bottom: 15px;\r\n            font-size: 18px;\r\n            text-align: center;\r\n        }\r\n\r\n        #timeHistoryCanvas, #fftCanvas {\r\n            height: 300px;\r\n        }\r\n\r\n        .controls {\r\n            background: #f8f9fa;\r\n            border-radius: 15px;\r\n            padding: 25px;\r\n            box-shadow: 0 4px 15px rgba(0,0,0,0.1);\r\n            max-height: 820px;\r\n            overflow-y: auto;\r\n        }\r\n\r\n        .control-group {\r\n            margin-bottom: 25px;\r\n            padding-bottom: 20px;\r\n            border-bottom: 2px solid #e0e0e0;\r\n        }\r\n\r\n        .control-group:last-child {\r\n            border-bottom: none;\r\n        }\r\n\r\n        .control-group h3 {\r\n            color: #1e3c72;\r\n            margin-bottom: 15px;\r\n            font-size: 18px;\r\n        }\r\n\r\n        .slider-control {\r\n            margin-bottom: 15px;\r\n        }\r\n\r\n        .slider-control label {\r\n            display: block;\r\n            color: #555;\r\n            margin-bottom: 8px;\r\n            font-size: 14px;\r\n            font-weight: 500;\r\n        }\r\n\r\n        .slider-value {\r\n            float: right;\r\n            color: #1e3c72;\r\n            font-weight: bold;\r\n        }\r\n\r\n        input[type=\"range\"] {\r\n            width: 100%;\r\n            height: 6px;\r\n            border-radius: 5px;\r\n            background: #ddd;\r\n            outline: none;\r\n            -webkit-appearance: none;\r\n        }\r\n\r\n        input[type=\"range\"]::-webkit-slider-thumb {\r\n            -webkit-appearance: none;\r\n            appearance: none;\r\n            width: 18px;\r\n            height: 18px;\r\n            border-radius: 50%;\r\n            background: #1e3c72;\r\n            cursor: pointer;\r\n            box-shadow: 0 2px 5px rgba(0,0,0,0.2);\r\n        }\r\n\r\n        input[type=\"range\"]::-moz-range-thumb {\r\n            width: 18px;\r\n            height: 18px;\r\n            border-radius: 50%;\r\n            background: #1e3c72;\r\n            cursor: pointer;\r\n            box-shadow: 0 2px 5px rgba(0,0,0,0.2);\r\n        }\r\n\r\n        .checkbox-control {\r\n            margin-bottom: 12px;\r\n        }\r\n\r\n        .checkbox-control label {\r\n            display: flex;\r\n            align-items: center;\r\n            color: #555;\r\n            cursor: pointer;\r\n            font-size: 14px;\r\n        }\r\n\r\n        .checkbox-control input[type=\"checkbox\"] {\r\n            margin-right: 10px;\r\n            width: 18px;\r\n            height: 18px;\r\n            cursor: pointer;\r\n        }\r\n\r\n        button {\r\n            width: 100%;\r\n            padding: 12px;\r\n            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);\r\n            color: white;\r\n            border: none;\r\n            border-radius: 8px;\r\n            font-size: 16px;\r\n            font-weight: bold;\r\n            cursor: pointer;\r\n            transition: transform 0.2s, box-shadow 0.2s;\r\n            margin-bottom: 10px;\r\n        }\r\n\r\n        button:hover {\r\n            transform: translateY(-2px);\r\n            box-shadow: 0 5px 15px rgba(30, 60, 114, 0.4);\r\n        }\r\n\r\n        button:active {\r\n            transform: translateY(0);\r\n        }\r\n\r\n        .info-panel {\r\n            background: #e3f2fd;\r\n            border-left: 4px solid #1e3c72;\r\n            padding: 15px;\r\n            border-radius: 8px;\r\n            margin-top: 15px;\r\n        }\r\n\r\n        .info-panel h4 {\r\n            color: #333;\r\n            margin-bottom: 8px;\r\n            font-size: 14px;\r\n        }\r\n\r\n        .info-panel p {\r\n            color: #666;\r\n            font-size: 12px;\r\n            line-height: 1.6;\r\n        }\r\n\r\n        .mode-buttons {\r\n            display: grid;\r\n            grid-template-columns: 1fr 1fr;\r\n            gap: 8px;\r\n            margin-bottom: 15px;\r\n        }\r\n\r\n        .mode-buttons button {\r\n            padding: 8px;\r\n            font-size: 14px;\r\n        }\r\n\r\n        .frequency-display {\r\n            background: white;\r\n            padding: 10px;\r\n            border-radius: 6px;\r\n            margin-top: 10px;\r\n            font-size: 12px;\r\n            color: #555;\r\n            line-height: 1.5;\r\n        }\r\n\r\n        .point-selector {\r\n            display: grid;\r\n            grid-template-columns: repeat(3, 1fr);\r\n            gap: 8px;\r\n            margin-top: 10px;\r\n        }\r\n\r\n        .point-selector button {\r\n            padding: 8px;\r\n            font-size: 13px;\r\n        }\r\n\r\n        .bridge-info {\r\n            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);\r\n            color: white;\r\n            padding: 15px;\r\n            border-radius: 10px;\r\n            margin-bottom: 20px;\r\n            text-align: center;\r\n        }\r\n\r\n        .bridge-info h2 {\r\n            font-size: 20px;\r\n            margin-bottom: 8px;\r\n        }\r\n\r\n        .bridge-info p {\r\n            font-size: 13px;\r\n            opacity: 0.9;\r\n        }\r\n    \u003c/style>\r\n\u003c/head>\r\n\u003cbody>\r\n    \u003cdiv class=\"container\">\r\n        \u003ch1>🌉 大跨度桥梁振动分析系统\u003c/h1>\r\n        \u003cp class=\"subtitle\">Long-Span Bridge Vibration Analysis - Simply Supported Beam Model\u003c/p>\r\n\r\n        \u003cdiv class=\"bridge-info\">\r\n            \u003ch2>简支梁桥梁模型\u003c/h2>\r\n            \u003cp>跨度: 100m | 结构类型: 双支座简支梁 | 分析方法: 模态叠加法\u003c/p>\r\n        \u003c/div>\r\n\r\n        \u003cdiv class=\"main-content\">\r\n            \u003cdiv class=\"canvas-container\">\r\n                \u003ccanvas id=\"bridgeCanvas\">\u003c/canvas>\r\n            \u003c/div>\r\n\r\n            \u003cdiv class=\"controls\">\r\n                \u003cdiv class=\"control-group\">\r\n                    \u003ch3>🎯 振型选择\u003c/h3>\r\n                    \u003cdiv class=\"mode-buttons\">\r\n                        \u003cbutton onclick=\"setMode(1)\">第1阶\u003c/button>\r\n                        \u003cbutton onclick=\"setMode(2)\">第2阶\u003c/button>\r\n                        \u003cbutton onclick=\"setMode(3)\">第3阶\u003c/button>\r\n                        \u003cbutton onclick=\"setMode(4)\">第4阶\u003c/button>\r\n                    \u003c/div>\r\n                    \u003cdiv class=\"frequency-display\" id=\"freqDisplay\">\r\n                        当前频率: 0.00 Hz\r\n                    \u003c/div>\r\n                \u003c/div>\r\n\r\n                \u003cdiv class=\"control-group\">\r\n                    \u003ch3>⚙️ 振动参数\u003c/h3>\r\n                    \u003cdiv class=\"slider-control\">\r\n                        \u003clabel>\r\n                            振幅倍数\r\n                            \u003cspan class=\"slider-value\" id=\"ampValue\">2.0\u003c/span>\r\n                        \u003c/label>\r\n                        \u003cinput type=\"range\" id=\"amplitude\" min=\"0.5\" max=\"5\" step=\"0.1\" value=\"2\">\r\n                    \u003c/div>\r\n\r\n                    \u003cdiv class=\"slider-control\">\r\n                        \u003clabel>\r\n                            动画速度\r\n                            \u003cspan class=\"slider-value\" id=\"speedValue\">1.0x\u003c/span>\r\n                        \u003c/label>\r\n                        \u003cinput type=\"range\" id=\"speed\" min=\"0.1\" max=\"3\" step=\"0.1\" value=\"1\">\r\n                    \u003c/div>\r\n\r\n                    \u003cdiv class=\"slider-control\">\r\n                        \u003clabel>\r\n                            阻尼比 (ξ)\r\n                            \u003cspan class=\"slider-value\" id=\"dampValue\">0.03\u003c/span>\r\n                        \u003c/label>\r\n                        \u003cinput type=\"range\" id=\"damping\" min=\"0\" max=\"0.5\" step=\"0.005\" value=\"0.03\">\r\n                    \u003c/div>\r\n                \u003c/div>\r\n\r\n                \u003cdiv class=\"control-group\">\r\n                    \u003ch3>🔧 模态组合\u003c/h3>\r\n                    \u003cdiv class=\"checkbox-control\">\r\n                        \u003clabel>\r\n                            \u003cinput type=\"checkbox\" id=\"mode1\" checked>\r\n                            第1阶振型 - 竖弯 (1.00 Hz)\r\n                        \u003c/label>\r\n                    \u003c/div>\r\n                    \u003cdiv class=\"checkbox-control\">\r\n                        \u003clabel>\r\n                            \u003cinput type=\"checkbox\" id=\"mode2\">\r\n                            第2阶振型 - 竖弯 (2.00 Hz)\r\n                        \u003c/label>\r\n                    \u003c/div>\r\n                    \u003cdiv class=\"checkbox-control\">\r\n                        \u003clabel>\r\n                            \u003cinput type=\"checkbox\" id=\"mode3\">\r\n                            第3阶振型 - 竖弯 (3.00 Hz)\r\n                        \u003c/label>\r\n                    \u003c/div>\r\n                    \u003cdiv class=\"checkbox-control\">\r\n                        \u003clabel>\r\n                            \u003cinput type=\"checkbox\" id=\"mode4\">\r\n                            第4阶振型 - 竖弯 (4.00 Hz)\r\n                        \u003c/label>\r\n                    \u003c/div>\r\n                \u003c/div>\r\n\r\n                \u003cdiv class=\"control-group\">\r\n                    \u003ch3>🌊 环境激励\u003c/h3>\r\n                    \u003cdiv class=\"slider-control\">\r\n                        \u003clabel>\r\n                            激励强度 (风/车辆)\r\n                            \u003cspan class=\"slider-value\" id=\"randomValue\">0.0\u003c/span>\r\n                        \u003c/label>\r\n                        \u003cinput type=\"range\" id=\"randomIntensity\" min=\"0\" max=\"5\" step=\"0.1\" value=\"0\">\r\n                    \u003c/div>\r\n                    \u003cbutton onclick=\"toggleRandom()\">启动/停止环境激励\u003c/button>\r\n                \u003c/div>\r\n\r\n                \u003cdiv class=\"control-group\">\r\n                    \u003ch3>📊 监测点选择\u003c/h3>\r\n                    \u003cdiv class=\"point-selector\">\r\n                        \u003cbutton onclick=\"selectPoint(0.25)\">1/4跨\u003c/button>\r\n                        \u003cbutton onclick=\"selectPoint(0.5)\">跨中\u003c/button>\r\n                        \u003cbutton onclick=\"selectPoint(0.75)\">3/4跨\u003c/button>\r\n                    \u003c/div>\r\n                \u003c/div>\r\n\r\n                \u003cdiv class=\"control-group\">\r\n                    \u003cbutton onclick=\"toggleAnimation()\">⏯️ 暂停/播放\u003c/button>\r\n                    \u003cbutton onclick=\"resetAnimation()\">🔄 重置\u003c/button>\r\n                    \u003cbutton onclick=\"exportData()\">💾 导出数据 (CSV)\u003c/button>\r\n                \u003c/div>\r\n\r\n                \u003cdiv class=\"info-panel\">\r\n                    \u003ch4>💡 使用说明\u003c/h4>\r\n                    \u003cp>\r\n                        • 简支梁：两端铰支，可自由转动\u003cbr>\r\n                        • 振型：竖向弯曲振动模式\u003cbr>\r\n                        • 阻尼比：典型值0.02-0.05\u003cbr>\r\n                        • 环境激励：模拟风、车辆等\u003cbr>\r\n                        • FFT：识别桥梁自振频率\r\n                    \u003c/p>\r\n                \u003c/div>\r\n            \u003c/div>\r\n        \u003c/div>\r\n\r\n        \u003cdiv class=\"charts-section\">\r\n            \u003cdiv class=\"chart-container\">\r\n                \u003ch3>📈 竖向位移时程曲线\u003c/h3>\r\n                \u003ccanvas id=\"timeHistoryCanvas\">\u003c/canvas>\r\n            \u003c/div>\r\n            \u003cdiv class=\"chart-container\">\r\n                \u003ch3>🔬 频域分析 (FFT)\u003c/h3>\r\n                \u003ccanvas id=\"fftCanvas\">\u003c/canvas>\r\n            \u003c/div>\r\n        \u003c/div>\r\n    \u003c/div>\r\n\r\n    \u003cscript>\r\n        // Canvas setup\r\n        const bridgeCanvas = document.getElementById('bridgeCanvas');\r\n        const bridgeCtx = bridgeCanvas.getContext('2d');\r\n        const timeCanvas = document.getElementById('timeHistoryCanvas');\r\n        const timeCtx = timeCanvas.getContext('2d');\r\n        const fftCanvas = document.getElementById('fftCanvas');\r\n        const fftCtx = fftCanvas.getContext('2d');\r\n\r\n        // Set canvas sizes\r\n        function resizeCanvas() {\r\n            [bridgeCanvas, timeCanvas, fftCanvas].forEach(canvas => {\r\n                const rect = canvas.getBoundingClientRect();\r\n                canvas.width = rect.width;\r\n                canvas.height = rect.height;\r\n            });\r\n        }\r\n        resizeCanvas();\r\n        window.addEventListener('resize', resizeCanvas);\r\n\r\n        // Bridge parameters\r\n        const bridgeLength = 100.0; // 100 meters\r\n        const numNodes = 60;\r\n        let currentMode = 1;\r\n        let amplitude = 2.0;\r\n        let animationSpeed = 1.0;\r\n        let dampingRatio = 0.03;\r\n        let time = 0;\r\n        let isAnimating = true;\r\n        let randomIntensity = 0;\r\n        let isRandomActive = false;\r\n        let monitorPoint = 0.5; // Default to mid-span\r\n\r\n        // Modal frequencies (simplified): 1, 2, 3, 4 Hz\r\n        const modalFrequencies = [1.0, 2.0, 3.0, 4.0];\r\n\r\n        // Time history data storage\r\n        const maxHistoryLength = 1000;\r\n        let timeHistory = [];\r\n        let displacementHistory = [];\r\n\r\n        // Simply supported beam mode shapes: φ(x) = sin(nπx/L)\r\n        function modeShape(x, mode) {\r\n            return Math.sin(mode * Math.PI * x / bridgeLength);\r\n        }\r\n\r\n        // Damping envelope\r\n        function dampingEnvelope(t, omega, zeta) {\r\n            return Math.exp(-zeta * omega * t);\r\n        }\r\n\r\n        // Random excitation\r\n        let randomPhases = new Array(4).fill(0).map(() => Math.random() * Math.PI * 2);\r\n        let randomAmplitudes = new Array(4).fill(0).map(() => 0.1 + Math.random() * 0.2);\r\n        let noiseComponents = new Array(4).fill(0);\r\n\r\n        function updateRandomExcitation() {\r\n            for (let i = 0; i \u003c 4; i++) {\r\n                // Smooth random walk for wind/traffic simulation\r\n                noiseComponents[i] += (Math.random() - 0.5) * 0.15;\r\n                noiseComponents[i] *= 0.93; // Decay\r\n            }\r\n        }\r\n\r\n        function getRandomExcitation(mode, t) {\r\n            if (!isRandomActive) return 0;\r\n            const freq = modalFrequencies[mode - 1];\r\n            return randomIntensity * (\r\n                randomAmplitudes[mode - 1] * Math.sin(freq * 2 * Math.PI * t + randomPhases[mode - 1]) +\r\n                noiseComponents[mode - 1] * 0.6\r\n            );\r\n        }\r\n\r\n        // Calculate bridge displacement\r\n        function getDisplacement(x, t) {\r\n            let displacement = 0;\r\n\r\n            for (let mode = 1; mode \u003c= 4; mode++) {\r\n                const checkbox = document.getElementById(`mode${mode}`);\r\n                if (!checkbox.checked) continue;\r\n\r\n                const omega = modalFrequencies[mode - 1] * 2 * Math.PI;\r\n                const zeta = dampingRatio;\r\n                const envelope = dampingEnvelope(t, omega, zeta);\r\n                const phi = modeShape(x, mode);\r\n                const randomComponent = getRandomExcitation(mode, t);\r\n\r\n                displacement += phi * envelope *\r\n                               Math.sin(omega * t) * amplitude * 0.3 +\r\n                               phi * randomComponent * 0.3;\r\n            }\r\n\r\n            return displacement;\r\n        }\r\n\r\n        // Draw bridge\r\n        function drawBridge() {\r\n            bridgeCtx.clearRect(0, 0, bridgeCanvas.width, bridgeCanvas.height);\r\n\r\n            const margin = 60;\r\n            const scale = (bridgeCanvas.width - 2 * margin);\r\n            const centerY = bridgeCanvas.height / 2;\r\n            const amplitudeScale = bridgeCanvas.height * 0.25;\r\n\r\n            // Draw supports (pins at both ends)\r\n            const supportHeight = 40;\r\n            const supportWidth = 30;\r\n\r\n            // Left support (pin)\r\n            bridgeCtx.fillStyle = '#333';\r\n            bridgeCtx.beginPath();\r\n            bridgeCtx.moveTo(margin, centerY);\r\n            bridgeCtx.lineTo(margin - supportWidth/2, centerY + supportHeight);\r\n            bridgeCtx.lineTo(margin + supportWidth/2, centerY + supportHeight);\r\n            bridgeCtx.closePath();\r\n            bridgeCtx.fill();\r\n\r\n            // Draw small circle for pin joint\r\n            bridgeCtx.fillStyle = '#666';\r\n            bridgeCtx.beginPath();\r\n            bridgeCtx.arc(margin, centerY, 8, 0, Math.PI * 2);\r\n            bridgeCtx.fill();\r\n\r\n            // Right support (pin)\r\n            bridgeCtx.fillStyle = '#333';\r\n            bridgeCtx.beginPath();\r\n            bridgeCtx.moveTo(margin + scale, centerY);\r\n            bridgeCtx.lineTo(margin + scale - supportWidth/2, centerY + supportHeight);\r\n            bridgeCtx.lineTo(margin + scale + supportWidth/2, centerY + supportHeight);\r\n            bridgeCtx.closePath();\r\n            bridgeCtx.fill();\r\n\r\n            bridgeCtx.fillStyle = '#666';\r\n            bridgeCtx.beginPath();\r\n            bridgeCtx.arc(margin + scale, centerY, 8, 0, Math.PI * 2);\r\n            bridgeCtx.fill();\r\n\r\n            // Draw ground\r\n            bridgeCtx.strokeStyle = '#666';\r\n            bridgeCtx.lineWidth = 3;\r\n            for (let i = -1; i \u003c= 1; i++) {\r\n                const x1 = margin + i * supportWidth;\r\n                const x2 = margin + scale + i * supportWidth;\r\n                for (let j = 0; j \u003c 5; j++) {\r\n                    bridgeCtx.beginPath();\r\n                    bridgeCtx.moveTo(x1 - supportWidth/2 + j * 8, centerY + supportHeight);\r\n                    bridgeCtx.lineTo(x1 - supportWidth/2 + j * 8 - 6, centerY + supportHeight + 8);\r\n                    bridgeCtx.stroke();\r\n\r\n                    bridgeCtx.beginPath();\r\n                    bridgeCtx.moveTo(x2 - supportWidth/2 + j * 8, centerY + supportHeight);\r\n                    bridgeCtx.lineTo(x2 - supportWidth/2 + j * 8 - 6, centerY + supportHeight + 8);\r\n                    bridgeCtx.stroke();\r\n                }\r\n            }\r\n\r\n            // Draw original bridge deck (dashed)\r\n            bridgeCtx.strokeStyle = '#ccc';\r\n            bridgeCtx.lineWidth = 2;\r\n            bridgeCtx.setLineDash([8, 8]);\r\n            bridgeCtx.beginPath();\r\n            bridgeCtx.moveTo(margin, centerY);\r\n            bridgeCtx.lineTo(margin + scale, centerY);\r\n            bridgeCtx.stroke();\r\n            bridgeCtx.setLineDash([]);\r\n\r\n            // Draw deformed bridge deck\r\n            bridgeCtx.strokeStyle = '#1e3c72';\r\n            bridgeCtx.lineWidth = 4;\r\n            bridgeCtx.shadowColor = 'rgba(30, 60, 114, 0.5)';\r\n            bridgeCtx.shadowBlur = 10;\r\n\r\n            bridgeCtx.beginPath();\r\n            for (let i = 0; i \u003c= numNodes; i++) {\r\n                const x = (i / numNodes) * bridgeLength;\r\n                const displacement = getDisplacement(x, time);\r\n                const screenX = margin + (x / bridgeLength) * scale;\r\n                const screenY = centerY + displacement * amplitudeScale; // Positive down for bridge\r\n\r\n                if (i === 0) {\r\n                    bridgeCtx.moveTo(screenX, screenY);\r\n                } else {\r\n                    bridgeCtx.lineTo(screenX, screenY);\r\n                }\r\n            }\r\n            bridgeCtx.stroke();\r\n            bridgeCtx.shadowBlur = 0;\r\n\r\n            // Draw deck thickness\r\n            bridgeCtx.strokeStyle = '#2a5298';\r\n            bridgeCtx.lineWidth = 3;\r\n            bridgeCtx.beginPath();\r\n            for (let i = 0; i \u003c= numNodes; i++) {\r\n                const x = (i / numNodes) * bridgeLength;\r\n                const displacement = getDisplacement(x, time);\r\n                const screenX = margin + (x / bridgeLength) * scale;\r\n                const screenY = centerY + displacement * amplitudeScale + 6;\r\n\r\n                if (i === 0) {\r\n                    bridgeCtx.moveTo(screenX, screenY);\r\n                } else {\r\n                    bridgeCtx.lineTo(screenX, screenY);\r\n                }\r\n            }\r\n            bridgeCtx.stroke();\r\n\r\n            // Draw monitoring points along bridge\r\n            bridgeCtx.fillStyle = '#2a5298';\r\n            for (let i = 0; i \u003c= numNodes; i += 10) {\r\n                const x = (i / numNodes) * bridgeLength;\r\n                const displacement = getDisplacement(x, time);\r\n                const screenX = margin + (x / bridgeLength) * scale;\r\n                const screenY = centerY + displacement * amplitudeScale;\r\n\r\n                bridgeCtx.beginPath();\r\n                bridgeCtx.arc(screenX, screenY, 3, 0, Math.PI * 2);\r\n                bridgeCtx.fill();\r\n            }\r\n\r\n            // Draw monitor point marker\r\n            const monitorX = monitorPoint * bridgeLength;\r\n            const monitorDisplacement = getDisplacement(monitorX, time);\r\n            const monitorScreenX = margin + monitorPoint * scale;\r\n            const monitorScreenY = centerY + monitorDisplacement * amplitudeScale;\r\n\r\n            bridgeCtx.fillStyle = '#ff6b6b';\r\n            bridgeCtx.beginPath();\r\n            bridgeCtx.arc(monitorScreenX, monitorScreenY, 10, 0, Math.PI * 2);\r\n            bridgeCtx.fill();\r\n\r\n            // Draw displacement arrow and value\r\n            if (Math.abs(monitorDisplacement) > 0.001) {\r\n                bridgeCtx.strokeStyle = '#ff6b6b';\r\n                bridgeCtx.lineWidth = 2;\r\n                bridgeCtx.setLineDash([5, 5]);\r\n                bridgeCtx.beginPath();\r\n                bridgeCtx.moveTo(monitorScreenX, centerY);\r\n                bridgeCtx.lineTo(monitorScreenX, monitorScreenY);\r\n                bridgeCtx.stroke();\r\n                bridgeCtx.setLineDash([]);\r\n\r\n                bridgeCtx.fillStyle = '#333';\r\n                bridgeCtx.font = 'bold 13px Arial';\r\n                const dispText = `δ = ${(monitorDisplacement * 1000).toFixed(2)} mm`;\r\n                bridgeCtx.fillText(dispText, monitorScreenX + 15, (centerY + monitorScreenY) / 2);\r\n            }\r\n\r\n            // Draw labels\r\n            bridgeCtx.fillStyle = '#333';\r\n            bridgeCtx.font = '14px Arial';\r\n            bridgeCtx.fillText('左支座', margin - 20, centerY + supportHeight + 30);\r\n            bridgeCtx.fillText('右支座', margin + scale - 20, centerY + supportHeight + 30);\r\n\r\n            // Draw span markers\r\n            bridgeCtx.font = '12px Arial';\r\n            bridgeCtx.fillStyle = '#666';\r\n            bridgeCtx.fillText('0m', margin - 10, centerY - 50);\r\n            bridgeCtx.fillText('25m', margin + scale * 0.25 - 15, centerY - 50);\r\n            bridgeCtx.fillText('50m (跨中)', margin + scale * 0.5 - 30, centerY - 50);\r\n            bridgeCtx.fillText('75m', margin + scale * 0.75 - 15, centerY - 50);\r\n            bridgeCtx.fillText('100m', margin + scale - 20, centerY - 50);\r\n\r\n            // Draw current mode info\r\n            bridgeCtx.font = 'bold 16px Arial';\r\n            bridgeCtx.fillStyle = '#1e3c72';\r\n            const activeModes = [];\r\n            for (let i = 1; i \u003c= 4; i++) {\r\n                if (document.getElementById(`mode${i}`).checked) {\r\n                    activeModes.push(i);\r\n                }\r\n            }\r\n            const modeText = activeModes.length > 0 ?\r\n                           `激活振型: ${activeModes.join(', ')}` : '无激活振型';\r\n            bridgeCtx.fillText(modeText, margin, 30);\r\n\r\n            // Draw monitor point location\r\n            bridgeCtx.font = '12px Arial';\r\n            bridgeCtx.fillStyle = '#ff6b6b';\r\n            bridgeCtx.fillText(`监测点: ${(monitorPoint * bridgeLength).toFixed(1)}m`, bridgeCanvas.width - 150, 30);\r\n\r\n            // Draw time\r\n            bridgeCtx.fillStyle = '#666';\r\n            bridgeCtx.fillText(`时间: ${time.toFixed(2)} s`, bridgeCanvas.width - 150, 50);\r\n        }\r\n\r\n        // Draw time history\r\n        function drawTimeHistory() {\r\n            timeCtx.clearRect(0, 0, timeCanvas.width, timeCanvas.height);\r\n\r\n            const margin = 50;\r\n            const plotWidth = timeCanvas.width - 2 * margin;\r\n            const plotHeight = timeCanvas.height - 2 * margin;\r\n            const centerY = timeCanvas.height / 2;\r\n\r\n            // Draw axes\r\n            timeCtx.strokeStyle = '#333';\r\n            timeCtx.lineWidth = 2;\r\n            timeCtx.beginPath();\r\n            timeCtx.moveTo(margin, margin);\r\n            timeCtx.lineTo(margin, timeCanvas.height - margin);\r\n            timeCtx.lineTo(timeCanvas.width - margin, timeCanvas.height - margin);\r\n            timeCtx.stroke();\r\n\r\n            // Draw grid\r\n            timeCtx.strokeStyle = '#e0e0e0';\r\n            timeCtx.lineWidth = 1;\r\n            for (let i = 0; i \u003c= 5; i++) {\r\n                const y = margin + (plotHeight * i / 5);\r\n                timeCtx.beginPath();\r\n                timeCtx.moveTo(margin, y);\r\n                timeCtx.lineTo(timeCanvas.width - margin, y);\r\n                timeCtx.stroke();\r\n            }\r\n\r\n            // Draw zero line\r\n            timeCtx.strokeStyle = '#999';\r\n            timeCtx.lineWidth = 1;\r\n            timeCtx.setLineDash([5, 5]);\r\n            timeCtx.beginPath();\r\n            timeCtx.moveTo(margin, centerY);\r\n            timeCtx.lineTo(timeCanvas.width - margin, centerY);\r\n            timeCtx.stroke();\r\n            timeCtx.setLineDash([]);\r\n\r\n            if (displacementHistory.length > 1) {\r\n                const maxDisp = Math.max(...displacementHistory.map(Math.abs), 0.01);\r\n\r\n                // Draw displacement curve\r\n                timeCtx.strokeStyle = '#1e3c72';\r\n                timeCtx.lineWidth = 2.5;\r\n                timeCtx.beginPath();\r\n\r\n                for (let i = 0; i \u003c displacementHistory.length; i++) {\r\n                    const x = margin + (i / maxHistoryLength) * plotWidth;\r\n                    const y = centerY - (displacementHistory[i] / maxDisp) * (plotHeight / 2) * 0.8;\r\n\r\n                    if (i === 0) {\r\n                        timeCtx.moveTo(x, y);\r\n                    } else {\r\n                        timeCtx.lineTo(x, y);\r\n                    }\r\n                }\r\n                timeCtx.stroke();\r\n            }\r\n\r\n            // Draw labels\r\n            timeCtx.fillStyle = '#333';\r\n            timeCtx.font = '14px Arial';\r\n            timeCtx.fillText('位移 (mm)', 10, 30);\r\n            timeCtx.fillText('时间 (s)', timeCanvas.width - 80, timeCanvas.height - 10);\r\n\r\n            // Y-axis labels\r\n            if (displacementHistory.length > 0) {\r\n                const maxDisp = Math.max(...displacementHistory.map(Math.abs), 0.01);\r\n                timeCtx.font = '11px Arial';\r\n                timeCtx.fillText((maxDisp * 1000).toFixed(1), 5, margin);\r\n                timeCtx.fillText('0', 5, centerY);\r\n                timeCtx.fillText((-maxDisp * 1000).toFixed(1), 5, timeCanvas.height - margin);\r\n            }\r\n        }\r\n\r\n        // FFT implementation\r\n        function computeFFT(data) {\r\n            const N = data.length;\r\n            const frequencies = [];\r\n            const magnitudes = [];\r\n\r\n            for (let k = 0; k \u003c N / 2; k++) {\r\n                let real = 0;\r\n                let imag = 0;\r\n\r\n                for (let n = 0; n \u003c N; n++) {\r\n                    const angle = -2 * Math.PI * k * n / N;\r\n                    real += data[n] * Math.cos(angle);\r\n                    imag += data[n] * Math.sin(angle);\r\n                }\r\n\r\n                const magnitude = Math.sqrt(real * real + imag * imag) / N;\r\n                magnitudes.push(magnitude);\r\n\r\n                const dt = 0.016 * animationSpeed;\r\n                const samplingRate = 1 / dt;\r\n                frequencies.push(k * samplingRate / N);\r\n            }\r\n\r\n            return { frequencies, magnitudes };\r\n        }\r\n\r\n        // Draw FFT\r\n        function drawFFT() {\r\n            fftCtx.clearRect(0, 0, fftCanvas.width, fftCanvas.height);\r\n\r\n            const margin = 50;\r\n            const plotWidth = fftCanvas.width - 2 * margin;\r\n            const plotHeight = fftCanvas.height - 2 * margin;\r\n\r\n            // Draw axes\r\n            fftCtx.strokeStyle = '#333';\r\n            fftCtx.lineWidth = 2;\r\n            fftCtx.beginPath();\r\n            fftCtx.moveTo(margin, margin);\r\n            fftCtx.lineTo(margin, fftCanvas.height - margin);\r\n            fftCtx.lineTo(fftCanvas.width - margin, fftCanvas.height - margin);\r\n            fftCtx.stroke();\r\n\r\n            // Draw grid\r\n            fftCtx.strokeStyle = '#e0e0e0';\r\n            fftCtx.lineWidth = 1;\r\n            for (let i = 0; i \u003c= 5; i++) {\r\n                const y = margin + (plotHeight * i / 5);\r\n                fftCtx.beginPath();\r\n                fftCtx.moveTo(margin, y);\r\n                fftCtx.lineTo(fftCanvas.width - margin, y);\r\n                fftCtx.stroke();\r\n            }\r\n\r\n            if (displacementHistory.length >= 64) {\r\n                const { frequencies, magnitudes } = computeFFT(displacementHistory.slice(-512));\r\n                const maxFreq = 10;\r\n                const maxMag = Math.max(...magnitudes, 0.001);\r\n\r\n                // Draw spectrum\r\n                fftCtx.fillStyle = '#2a5298';\r\n                for (let i = 0; i \u003c frequencies.length && frequencies[i] \u003c= maxFreq; i++) {\r\n                    const x = margin + (frequencies[i] / maxFreq) * plotWidth;\r\n                    const height = (magnitudes[i] / maxMag) * plotHeight * 0.9;\r\n                    const y = fftCanvas.height - margin - height;\r\n                    const barWidth = plotWidth / frequencies.length;\r\n\r\n                    fftCtx.fillRect(x, y, barWidth * 0.8, height);\r\n                }\r\n\r\n                // Mark modal frequencies\r\n                fftCtx.strokeStyle = '#ff6b6b';\r\n                fftCtx.lineWidth = 2;\r\n                fftCtx.setLineDash([5, 5]);\r\n                for (let i = 0; i \u003c 4; i++) {\r\n                    if (document.getElementById(`mode${i+1}`).checked) {\r\n                        const freq = modalFrequencies[i];\r\n                        if (freq \u003c= maxFreq) {\r\n                            const x = margin + (freq / maxFreq) * plotWidth;\r\n                            fftCtx.beginPath();\r\n                            fftCtx.moveTo(x, margin);\r\n                            fftCtx.lineTo(x, fftCanvas.height - margin);\r\n                            fftCtx.stroke();\r\n\r\n                            fftCtx.fillStyle = '#ff6b6b';\r\n                            fftCtx.font = 'bold 11px Arial';\r\n                            fftCtx.fillText(`f${i+1}=${freq}Hz`, x + 3, margin + 15 + i * 15);\r\n                        }\r\n                    }\r\n                }\r\n                fftCtx.setLineDash([]);\r\n            }\r\n\r\n            // Draw labels\r\n            fftCtx.fillStyle = '#333';\r\n            fftCtx.font = '14px Arial';\r\n            fftCtx.fillText('幅值', 10, 30);\r\n            fftCtx.fillText('频率 (Hz)', fftCanvas.width - 80, fftCanvas.height - 10);\r\n\r\n            // X-axis labels\r\n            fftCtx.font = '11px Arial';\r\n            for (let i = 0; i \u003c= 5; i++) {\r\n                const freq = i * 2;\r\n                const x = margin + (freq / 10) * plotWidth;\r\n                fftCtx.fillText(freq.toString(), x - 5, fftCanvas.height - margin + 20);\r\n            }\r\n        }\r\n\r\n        // Animation loop\r\n        function animate() {\r\n            if (isAnimating) {\r\n                time += 0.016 * animationSpeed;\r\n                updateRandomExcitation();\r\n\r\n                const displacement = getDisplacement(monitorPoint * bridgeLength, time);\r\n                timeHistory.push(time);\r\n                displacementHistory.push(displacement);\r\n\r\n                if (timeHistory.length > maxHistoryLength) {\r\n                    timeHistory.shift();\r\n                    displacementHistory.shift();\r\n                }\r\n\r\n                drawBridge();\r\n                drawTimeHistory();\r\n                drawFFT();\r\n            }\r\n            requestAnimationFrame(animate);\r\n        }\r\n\r\n        // Control functions\r\n        function setMode(mode) {\r\n            currentMode = mode;\r\n            for (let i = 1; i \u003c= 4; i++) {\r\n                document.getElementById(`mode${i}`).checked = false;\r\n            }\r\n            document.getElementById(`mode${mode}`).checked = true;\r\n            updateFrequencyDisplay();\r\n        }\r\n\r\n        function selectPoint(position) {\r\n            monitorPoint = position;\r\n            timeHistory = [];\r\n            displacementHistory = [];\r\n        }\r\n\r\n        function toggleAnimation() {\r\n            isAnimating = !isAnimating;\r\n        }\r\n\r\n        function resetAnimation() {\r\n            time = 0;\r\n            timeHistory = [];\r\n            displacementHistory = [];\r\n            randomPhases = new Array(4).fill(0).map(() => Math.random() * Math.PI * 2);\r\n            noiseComponents = new Array(4).fill(0);\r\n        }\r\n\r\n        function toggleRandom() {\r\n            isRandomActive = !isRandomActive;\r\n            if (isRandomActive) {\r\n                randomPhases = new Array(4).fill(0).map(() => Math.random() * Math.PI * 2);\r\n                noiseComponents = new Array(4).fill(0);\r\n            }\r\n        }\r\n\r\n        function updateFrequencyDisplay() {\r\n            const activeModes = [];\r\n            for (let i = 1; i \u003c= 4; i++) {\r\n                if (document.getElementById(`mode${i}`).checked) {\r\n                    activeModes.push(`第${i}阶: ${modalFrequencies[i-1].toFixed(2)} Hz`);\r\n                }\r\n            }\r\n            const freqText = activeModes.length > 0 ?\r\n                           activeModes.join('\u003cbr>') : '无激活振型';\r\n            document.getElementById('freqDisplay').innerHTML = `${freqText}`;\r\n        }\r\n\r\n        function exportData() {\r\n            if (timeHistory.length === 0) {\r\n                alert('没有数据可导出！请先运行模拟。');\r\n                return;\r\n            }\r\n\r\n            let csv = '时间(s),位移(mm)\\n';\r\n            for (let i = 0; i \u003c timeHistory.length; i++) {\r\n                csv += `${timeHistory[i].toFixed(4)},${(displacementHistory[i] * 1000).toFixed(6)}\\n`;\r\n            }\r\n\r\n            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });\r\n            const url = window.URL.createObjectURL(blob);\r\n            const a = document.createElement('a');\r\n            a.href = url;\r\n            a.download = `bridge_vibration_${new Date().getTime()}.csv`;\r\n            a.click();\r\n            window.URL.revokeObjectURL(url);\r\n        }\r\n\r\n        // Event listeners\r\n        document.getElementById('amplitude').addEventListener('input', (e) => {\r\n            amplitude = parseFloat(e.target.value);\r\n            document.getElementById('ampValue').textContent = amplitude.toFixed(1);\r\n        });\r\n\r\n        document.getElementById('speed').addEventListener('input', (e) => {\r\n            animationSpeed = parseFloat(e.target.value);\r\n            document.getElementById('speedValue').textContent = animationSpeed.toFixed(1) + 'x';\r\n        });\r\n\r\n        document.getElementById('damping').addEventListener('input', (e) => {\r\n            dampingRatio = parseFloat(e.target.value);\r\n            document.getElementById('dampValue').textContent = dampingRatio.toFixed(3);\r\n        });\r\n\r\n        document.getElementById('randomIntensity').addEventListener('input', (e) => {\r\n            randomIntensity = parseFloat(e.target.value);\r\n            document.getElementById('randomValue').textContent = randomIntensity.toFixed(1);\r\n        });\r\n\r\n        for (let i = 1; i \u003c= 4; i++) {\r\n            document.getElementById(`mode${i}`).addEventListener('change', updateFrequencyDisplay);\r\n        }\r\n\r\n        // Start animation\r\n        updateFrequencyDisplay();\r\n        animate();\r\n    \u003c/script>\r\n\u003c/body>\r\n\u003c/html>"};</script><script>/* Coordinated force, motion and spectral views. All values come from the same samples as the main animation. */
const LabExtension=(()=>{
 const $=s=>document.querySelector(s),B='#1664b7',O='#b84f19',V='#7951a8',T='#0b746c',I='#172d40';
 const num=(v,n=2)=>Number(v).toFixed(n),signed=v=>(v>=0?'+':'')+num(v);
 let host,idx=-1,p={},sample,end=8,scale=10,views={3:'phase',5:'time'},lastState=null,maxTrace=0,plotSerial=0,record=[];
 function ensure(){if(!host){host=document.createElement('div');host.id='deep-lab';$('.chart-wrap').insertAdjacentElement('beforebegin',host);document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){views[idx]=b.dataset.view;applyView();if(lastState)draw(lastState);}const option=e.target.closest('[data-diag-setting]');if(option){const prior=lastState;PhaseViews.set(option.dataset.diagSetting,option.dataset.value);setup(idx,p,sample,end,scale);if(prior)draw(prior);}});document.addEventListener('change',e=>{if(e.target.id==='view-select'){views[idx]=e.target.value;applyView();if(lastState)draw(lastState);}});}return host;}
 function linePlot(rows){

  });

  return `<svg viewBox="0 0 640 ${rows.length*h+28}" class="deep-chart" role="img" aria-label="共用时间轴的同步时程">${svg}</svg>`;

 function setup(i,params,fn,duration,max){ensure();idx=i;p=params;sample=fn;end=duration;scale=max;lastState=null;PhaseViews.reset();
  $('#view-navigation').innerHTML='';

  const count=Math.max(801,Math.ceil(end*Math.max(p.frequency||0,sample(0).fn||1)*64)+1);record=Array.from({length:count},(_,n)=>sample(n*end/(count-1)));maxTrace=Math.max(...record.map(r=>i===3?Math.max(Math.abs(r.x),Math.abs(r.ma),Math.abs(r.cv),Math.abs(r.kx),Math.abs(r.F)):Math.abs(r.x)));
  const tabs=i===3?[['phase','相位与两种轨迹'],['frequency','D 与相位频响'],['envelope','启动分解与包络'],['forces','力的平衡'],['motion','位移·速度·加速度']]:[['time','输入与响应时程'],['spectrum','谱的转换']];
  $('#view-navigation').innerHTML=`<label class="view-select-label" for="view-select">观察内容</label><select id="view-select">${tabs.map(([v,label])=>`<option value="${v}" ${views[i]===v?'selected':''}>${label}</option>`).join('')}</select><div class="deep-tabs" role="tablist" aria-label="观察角度">${tabs.map(([v,label])=>`<button role="tab" data-view="${v}" aria-selected="${views[i]===v}">${label}</button>`).join('')}</div>`;
  host.innerHTML='<div class="deep-context"></div><div class="deep-panel"></div>';
  if(i===3){renderForces();const extra=PhaseViews.resonance(p,sample,end,scale);host.querySelector('[data-panel="phase"]').innerHTML=extra.phase;host.querySelector('.deep-panel').insertAdjacentHTML('beforeend',`<div data-panel="frequency">${extra.frequency}</div><div data-panel="envelope">${extra.envelope}</div>`);host.querySelector('.deep-panel').append(host.querySelector('#range-warning'),host.querySelector('[data-param="displayRange"]'));}else renderSpectrum();applyView();
 }
 function renderForces(){
  const r=sample(0),probe=record,peak=key=>Math.max(.01,...probe.map(v=>Math.abs(v[key])))*1.1;
  const forceRows=[{label:'紫：惯性项 ma　蓝：弹性项 kx',unit:'N',curves:[{color:V,value:r=>r.ma},{color:B,value:r=>r.kx}]},{label:'绿：阻尼项 cẋ　橙虚线：外力 F',unit:'N',curves:[{color:T,value:r=>r.cv},{color:O,value:r=>r.F,dash:true}]}];
  const wn=Math.sqrt(p.stiffness/p.mass);

 if(idx===6){const a=200+r.x1*47,b=437+r.x2*47;return `<path d="M35 60V150M605 60V150" stroke="${G}" stroke-width="6"/><path d="M200 62V154M437 62V154" stroke="#c0ceda" stroke-dasharray="5 6"/>${spring(35,a-27,107)}${spring(a+27,b-27,107)}${spring(b+27,605,107)}<rect x="${a-27}" y="78" width="54" height="58" rx="8" fill="${B}"/><rect x="${b-27}" y="78" width="54" height="58" rx="8" fill="${O}"/><text x="${a}" y="177" text-anchor="middle">左边</text><text x="${b}" y="177" text-anchor="middle">右边</text>`;}
 if(idx===7){const wave=Math.cos(P.tau*t/5),mode=Number(params.mode),shape=s=>P.beamShape(s,mode,params.support);let d='';for(let i=0;i<=120;i++)d+=`${i?'L':'M'}${55+i/120*530},${105-shape(i/120)*wave*52} `;const sensorX=55+params.sensor*530,sensorY=105-r.x*52;return `<line x1="55" x2="585" y1="105" y2="105" stroke="#b6c5d3" stroke-dasharray="8 7"/>${params.support==='simple'?'<path d="M55 109l-15 23h30ZM585 109l-15 23h30Z" fill="#a9bac9"/>':'<path d="M48 43V161" stroke="#8293a3" stroke-width="10"/>'}<path d="${d}" stroke="${B}" stroke-width="6" fill="none"/><line x1="${sensorX}" x2="${sensorX}" y1="39" y2="170" stroke="${T}" stroke-width="1.5" stroke-dasharray="4 6"/><circle cx="${sensorX}" cy="${sensorY}" r="8" fill="${T}" stroke="white" stroke-width="3"/><text x="320" y="194" text-anchor="middle">测点位置 ${f(params.sensor*100,0)}%</text>`;}
 const scale=cartScale(),cx=334+r.x*scale,box=idx===1?45+Math.sqrt(params.mass)*14:58;
 let svg=`<path d="M42 62V150" stroke="${G}" stroke-width="7"/><path d="M40 151H600" stroke="#a3b5c6" stroke-width="2"/><line x1="334" x2="334" y1="48" y2="164" stroke="#abbcc9" stroke-dasharray="5 6"/>`;
 if(r.ref!==undefined){svg+=`<rect x="${334+r.ref*scale-29}" y="77" width="58" height="64" rx="8" stroke="${G}" stroke-dasharray="5 5" fill="#f4f7fa" opacity=".85"/>`;}
 svg+=spring(42,cx-box/2,106)+`<g ${idx<3?'data-drag-cart="true" tabindex="0" role="slider" aria-label="拖动小车设定初始位移；方向键移动，空格释放" aria-valuemin="-1.5" aria-valuemax="1.5" aria-valuenow="'+(params.amplitude??1)+'"':''}><rect x="${cx-box/2}" y="77" width="${box}" height="64" rx="8" fill="${B}"/><circle cx="${cx-17}" cy="146" r="5" fill="${G}"/><circle cx="${cx+17}" cy="146" r="5" fill="${G}"/>${idx<3?`<rect x="${cx-80}" y="20" width="160" height="160" fill="transparent"/>`:""}</g>`;
 if(idx<=2)svg+=arrow(cx,53,r.v*10,T,'速度');
 if(idx===3||idx===4)svg+=arrow(cx,54,r.F*67,O,'外力');
 svg+=`<text x="334" y="191" text-anchor="middle">原来静止的位置</text>`;
 return svg;
}
function drawFrame(){
 if(idx===0){DrivenLab.draw(t);$('#scrub').value=t;$('#time').textContent=f(t)+' s';return;}
 if(idx===5){SpectrumLab.draw(t);$('#scrub').value=t;$('#time').textContent=f(t)+' s';return;}
 if(idx===8){StaticLab.draw();return;}
 const r=getSample(t);$('#apparatus').innerHTML=apparatus(r);const xx=64+t/axis.end*552,yy=112-r.values[0]/axis.max*78;
 $('#time-cursor').setAttribute('x1',xx);$('#time-cursor').setAttribute('x2',xx);$('#time-dot').setAttribute('cx',xx);$('#time-dot').setAttribute('cy',yy);$('#time-dot').style.visibility=Math.abs(r.values[0])>axis.max?'hidden':'visible';$('#history-rect').setAttribute('width',552);
 $('#scrub').value=t;$('#time').textContent=idx===7?f(t/5)+' Tₙ':f(t)+' s';
 let a,b,c;
 if(idx===0){a=['当前位置',f(r.x)+' cm'];b=['当前速度',f(r.v)+' cm/s'];c=['完整往返','1 s'];}
 if(idx===1){a=['当前质量',f(params.mass,1)+' kg'];b=['当前周期',f(Math.sqrt(params.mass))+' s'];c=['原来周期','1 s'];}
 if(idx===2){a=['当前位移',f(r.x)+' cm'];b=['阻尼比',f(params.damping,3)];c=['观察时长',f(t)+' s'];}
 if(idx===3){a=['当前位移',f(r.xSI*100)+' cm'];b=['稳态振幅',f(r.D/r.k*100)+' cm'];c=['位移滞后外力',f(r.phase*180/Math.PI,1)+'°'];}
 if(idx===4){a=['当前位移',f(r.x)+' 倍'];b=['外力状态',t<params.duration?'仍在推动':'已经撤去'];c=['推力持续',f(params.duration,1)+' s'];}
 if(idx===5){const q=SpectrumLab.info(params);a=['当前荷载频率',f(params.frequency,3)+' Hz'];b=['D',f(q.D)];c=['相位滞后',f(q.phi*180/Math.PI,1)+'°'];}
 if(idx===6){a=['左边位移',f(r.x1)];b=['右边位移',f(r.x2)];c=['当前摆法',params.pattern==='one'?'只拉左边':params.pattern==='together'?'同向':'反向'];}
 if(idx===7){a=['测点位移',f(r.x)];b=['此处振幅',f(Math.abs(r.shape))];c=['本阶 / 第1阶频率',f(P.beamFrequency(Number(params.mode),params.support))+' 倍'];}
 $('#readouts').innerHTML=[a,b,c].map(([label,value])=>`<span>${label}<b>${phase===0?'—':value}</b></span>`).join('');
 if(detailReady&&$("#full-views").open)LabExtension.draw({idx,params,t,phase,r,axis});if(idx===5)SpectrumLab.draw(t);else Workbench.draw(t);if(idx<3)StructuralView.draw(r.x);
}
function changeParam(key,value){params[key]=typeof lesson().defaults[key]==='number'?Number(value):value;playing=false;t=0;if(idx===5&&key==='natural')params.frequency=Math.min(params.frequency,3*params.natural);if(idx===5&&key.startsWith('amp')){params.load='custom';document.querySelectorAll('[data-param="load"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value==='custom')));}const p=lesson().params.find(p=>p.key===key);if(p?.type==='choice')document.querySelectorAll(`[data-param="${key}"]`).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===String(value))));else if(p){if(key==='damping')$('#value-damping').value=Number(params.damping).toFixed(3);else $('#value-'+key).textContent=formatParam(p);$('#param-'+key).value=params[key];}prepare();drawFrame();renderPhase();}
function frame(now){if(dragDirty){dragDirty=false;prepare();drawFrame();}if(playing){if(last){const dt=Math.min((now-last)/1000,.1)*Number($('#speed').value);t=Math.min(axis.end,t+dt);}drawFrame();if(t>=axis.end){if($("#loop").checked){t=0;last=0;}else{playing=false;renderPhase();}}}last=now;requestAnimationFrame(frame);}
document.addEventListener('click',e=>{
 const preset=e.target.closest('[data-ratio]');if(preset&&idx===3){params.response='steady';document.querySelectorAll('[data-param="response"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value==='steady')));changeParam('frequency',Number(preset.dataset.ratio)*Math.sqrt(params.stiffness/params.mass)/P.tau);playing=true;last=0;renderPhase();focusForPhone();return;}
 if(e.target.closest('#tune-frequency')&&idx===3){const freq=Math.sqrt(params.stiffness/params.mass)/P.tau;changeParam('frequency',freq);$('#param-frequency').value=freq;return;}
 const l=e.target.closest('[data-lesson]');if(l){$('#course-menu').hidden=true;$('#open-menu').setAttribute('aria-expanded','false');selectLesson(Number(l.dataset.lesson));return;}
 const v=e.target.closest('[data-param]');if(v&&phase>0){changeParam(v.dataset.param,v.dataset.value);return;}
});
$('#parameter-controls').addEventListener('toggle',e=>{if(e.target.open){playing=false;renderPhase();}},true);
$('#parameter-controls').addEventListener('input',e=>{if(e.target.dataset.range)changeParam(e.target.dataset.range,e.target.value);});
$('#open-menu').onclick=()=>{const closed=$('#course-menu').hidden;$('#course-menu').hidden=!closed;$('#open-menu').setAttribute('aria-expanded',String(closed));};
$('#prev').onclick=()=>selectLesson(ACTIVE[ACTIVE.indexOf(idx)-1]);$('#next-top').onclick=()=>selectLesson(ACTIVE[ACTIVE.indexOf(idx)+1]);
$('#full-views').addEventListener('toggle',()=>{if($('#full-views').open&&detailDirty){LabExtension.setup(idx,params,getSample,axis.end,axis.max);detailReady=true;detailDirty=false;drawFrame();}});
$('#lab-lesson').onchange=e=>{selectLesson(Number(e.target.value),false);focusForPhone();};
document.addEventListener('change',e=>{if(e.target.id==='driven-case'&&e.target.value!=='manual')changeParam('frequency',Number(e.target.value)*Math.sqrt(params.stiffness/params.mass)/P.tau);if(e.target.id==='display-range')changeParam('displayRange',Number(e.target.value));if(e.target.id==='single-case'&&e.target.value!=='manual')changeParam('frequency',Number(e.target.value)*params.natural);if(e.target.dataset.number){if(e.target.value!==''&&e.target.validity.valid)changeParam(e.target.dataset.number,Number(e.target.value));else e.target.value=Number(params.damping).toFixed(3);}if(e.target.id==='typical-case'&&e.target.value!=='manual'){params.response='steady';changeParam('frequency',Number(e.target.value)*Math.sqrt(params.stiffness/params.mass)/P.tau);}if(e.target.id==='damping-case'&&e.target.value!=='manual')changeParam('damping',Number(e.target.value));});
$('#focus-settings').onclick=()=>{playing=false;const on=document.body.classList.toggle('show-settings');$('#focus-settings').textContent=on?'收起参数':'参数';if(on)document.querySelectorAll('#parameter-controls>details').forEach(d=>d.open=true);else document.querySelectorAll('#parameter-controls>details').forEach(d=>d.open=false);renderPhase();};
$('#focus-lab').onclick=()=>focusLab(!document.body.classList.contains('lab-focus'));
$('#play').onclick=()=>{focusForPhone();if(t>=axis.end){t=0;if(idx===5)SpectrumLab.setup(params);}playing=!playing;last=0;renderPhase();drawFrame();};
$('#reset').onclick=()=>{playing=false;t=0;drawFrame();renderPhase();};
$('#scrub').oninput=e=>{playing=false;t=Number(e.target.value);drawFrame();renderPhase();};
$('#advanced').addEventListener('toggle',()=>{if($('#advanced').open){playing=false;renderPhase();}});$('#original-code').addEventListener('toggle',()=>{if($('#original-code').open){playing=false;renderPhase();}});
$('#source-info').innerHTML='<p>改编自你提供的《课程全部代码与数据.zip》。适合非专业学习者；当前六个实验用于课堂讲授过程中的即时操作，从纯弹性静力开始，围绕质量、刚度、阻尼、共振与单频谱转换展开。</p><p>图中的运动由线性教学模型计算，不是实测桥梁记录。每次改参数会从相同初始条件重新运行；谱转换只播放选定频率的稳态运动，频率保持不变。</p><p>核心来源：Dynamics.m、Dynamics_MDOF.m、bridge_mode.m、bridge_mode_241011.m、cantilever_beam.html、bridge_vibration.html。bridge_demo.m 为静力截面演示，未纳入。</p><p>自由振动包含正负阻尼对比，梁振型频率已定标，启动与稳态分开显示；多频响应保留相位，避免把功率谱直接乘振幅倍率。详细提取清单、原代码与教学说明随交付压缩包提供。</p>';
$('#restore').onclick=()=>{params={};delete saved[idx];selectLesson(idx,false);};
$('#source-select').onchange=e=>{$('#source-code').textContent=ORIGINAL_SOURCES[e.target.value];};
$('#download-source').onclick=()=>{const name=$('#source-select').value,url=URL.createObjectURL(new Blob([ORIGINAL_SOURCES[name]],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
const cart=$("#apparatus");
function pointerPosition(e){const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(cart.getScreenCTM().inverse());return pt.x;}
function dragMove(e){if(!drag||e.pointerId!==drag.id)return;params.amplitude=Math.max(-1.5,Math.min(1.5,Math.round((pointerPosition(e)-drag.offset-334)/drag.scale*100)/100));t=0;dragDirty=true;if(idx===0){$("#param-amplitude").value=params.amplitude;$("#value-amplitude").textContent=f(params.amplitude)+" cm";}}
cart.addEventListener('pointerdown',e=>{if(idx===0||idx>2||!e.target.closest('[data-drag-cart]')||e.button!==0)return;e.preventDefault();const r=getSample(t),scale=cartScale();playing=false;t=0;drag={id:e.pointerId,scale,offset:pointerPosition(e)-(334+Math.max(-1.5,Math.min(1.5,r.x))*scale)};cart.setPointerCapture(e.pointerId);dragMove(e);renderPhase();});
cart.addEventListener('pointermove',dragMove);
function endDrag(e,cancel=false){if(!drag||e.pointerId!==drag.id)return;if(!cancel)dragMove(e);drag=null;dragDirty=false;if(cart.hasPointerCapture(e.pointerId))cart.releasePointerCapture(e.pointerId);prepare();t=0;playing=!cancel;last=0;renderPhase();drawFrame();if(!cancel)focusForPhone();}
cart.addEventListener('pointerup',e=>endDrag(e));cart.addEventListener('pointercancel',e=>endDrag(e,true));
cart.addEventListener('keydown',e=>{if(idx===0||idx>2||!e.target.closest('[data-drag-cart]'))return;if(['ArrowLeft','ArrowRight',' ','Enter'].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft'||e.key==='ArrowRight'){changeParam('amplitude',Math.max(-1.5,Math.min(1.5,(params.amplitude??1)+(e.key==='ArrowRight'?.1:-.1))));cart.querySelector('[data-drag-cart]').focus();}else{playing=true;t=0;last=0;focusForPhone();renderPhase();}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')focusLab(false);});
document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;renderPhase();}});
window.addEventListener('hashchange',()=>{const n=Number(location.hash.slice(1));if(ACTIVE.includes(n)&&n!==idx)selectLesson(n);});
const n=location.hash?Number(location.hash.slice(1)):8;selectLesson(ACTIVE.includes(n)?n:8,false);requestAnimationFrame(frame);focusForPhone();
})();
</script></body></html>
